<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <style>
    .box { fill: #e0f7fa; stroke: #006064; stroke-width: 2; }
    .arrow { fill: none; stroke: #006064; stroke-width: 2; marker-end: url(#arrowhead); }
    .text { font-size: 14px; fill: #004d40; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#006064" />
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="20" fill="#004d40">MiniGPT AI Commerce Agent Architecture</text>
  <!-- MiniGPT V2 pipeline -->
  <g id="miniGPT">
    <rect x="50" y="70" width="120" height="30" class="box" />
    <text x="110" y="90" text-anchor="middle" class="text">Q&A Dataset</text>
    <line x1="170" y1="85" x2="210" y2="85" class="arrow" />
    <rect x="210" y="70" width="120" height="30" class="box" />
    <text x="270" y="90" text-anchor="middle" class="text">BPE Tokenizer</text>
    <line x1="330" y1="85" x2="370" y2="85" class="arrow" />
    <rect x="370" y="70" width="140" height="30" class="box" />
    <text x="440" y="90" text-anchor="middle" class="text">MiniGPT Transformer</text>
    <line x1="520" y1="85" x2="560" y2="85" class="arrow" />
    <rect x="560" y="70" width="100" height="30" class="box" />
    <text x="610" y="90" text-anchor="middle" class="text">Training</text>
    <line x1="660" y1="85" x2="700" y2="85" class="arrow" />
    <rect x="700" y="70" width="100" height="30" class="box" />
    <text x="750" y="90" text-anchor="middle" class="text">Generation</text>
    <line x1="800" y1="85" x2="840" y2="85" class="arrow" />
    <rect x="840" y="70" width="100" height="30" class="box" />
    <text x="890" y="90" text-anchor="middle" class="text">Evaluation</text>
  </g>
  <!-- Commerce pipeline -->
  <g id="commerce" transform="translate(0,150)">
    <rect x="50" y="70" width="120" height="30" class="box" />
    <text x="110" y="90" text-anchor="middle" class="text">User Query</text>
    <line x1="170" y1="85" x2="210" y2="85" class="arrow" />
    <rect x="210" y="70" width="140" height="30" class="box" />
    <text x="280" y="90" text-anchor="middle" class="text">Query Understanding</text>
    <line x1="350" y1="85" x2="390" y2="85" class="arrow" />
    <rect x="390" y="70" width="160" height="30" class="box" />
    <text x="470" y="90" text-anchor="middle" class="text">Agent / Decision Engine</text>
    <line x1="550" y1="85" x2="590" y2="85" class="arrow" />
    <rect x="590" y="70" width="180" height="30" class="box" />
    <text x="680" y="90" text-anchor="middle" class="text">Search Orchestrator</text>
    <line x1="770" y1="85" x2="810" y2="85" class="arrow" />
    <rect x="810" y="70" width="240" height="80" class="box" />
    <text x="930" y="95" text-anchor="middle" class="text">Marketplace Provider Layer</text>
    <text x="930" y="115" text-anchor="middle" class="text">Amazon Mock, Flipkart Mock, Meesho Mock, Future Authorized Providers</text>
    <line x1="940" y1="150" x2="980" y2="150" class="arrow" />
    <rect x="980" y="135" width="200" height="30" class="box" />
    <text x="1080" y="155" text-anchor="middle" class="text">Normalized Product Schema</text>
    <line x1="1180" y1="150" x2="1220" y2="150" class="arrow" />
    <rect x="1220" y="135" width="180" height="30" class="box" />
    <text x="1310" y="155" text-anchor="middle" class="text">Filtering + Matching</text>
    <line x1="1320" y1="150" x2="1360" y2="150" class="arrow" />
    <rect x="1360" y="135" width="120" height="30" class="box" />
    <text x="1420" y="155" text-anchor="middle" class="text">Comparison</text>
    <line x1="1440" y1="150" x2="1480" y2="150" class="arrow" />
    <rect x="1480" y="135" width="140" height="30" class="box" />
    <text x="1550" y="155" text-anchor="middle" class="text">Recommendation</text>
    <line x1="1580" y1="150" x2="1620" y2="150" class="arrow" />
    <rect x="1620" y="135" width="120" height="30" class="box" />
    <text x="1680" y="155" text-anchor="middle" class="text">Explanation</text>
  </g>
</svg>
